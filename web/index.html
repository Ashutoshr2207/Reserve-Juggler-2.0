<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#163665">
  <meta name="description" content="Reserve Juggler — forecast Indian bank cashflows in INR, protect liquidity, and put surplus cash to work in a transparent treasury sandbox.">
  <title>Reserve Juggler — Every rupee, in its right place.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('rj_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>This application needs JavaScript to display forecasts and run the treasury simulation.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
